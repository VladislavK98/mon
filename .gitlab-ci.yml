image: docker:latest

services:
  - docker:dind

stages:
  - validate

cache:
  paths:
    - /root/.cache

validate:
  stage: validate
  script:
    - docker --version
    - docker-compose --version
    
    # 1. Проверяем синтаксис docker-compose.yml
    - echo "Checking docker-compose.yml syntax..."
    - docker-compose config
    - echo "✅ docker-compose.yml is valid"
    
    # 2. Проверяем наличие обязательных файлов
    - echo "Checking required files..."
    - test -f prometheus/prometheus.yml && echo "✅ prometheus/prometheus.yml exists" || (echo "❌ prometheus/prometheus.yml not found" && exit 1)
    - test -d grafana/provisioning/datasources && echo "✅ grafana/provisioning/datasources/ exists" || echo "⚠️ grafana/provisioning/datasources/ not found"
    - test -d grafana/provisioning/dashboards && echo "✅ grafana/provisioning/dashboards/ exists" || echo "⚠️ grafana/provisioning/dashboards/ not found"
    
    # 3. Проверяем валидность конфигурации Prometheus
    - echo "Checking Prometheus configuration..."
    - docker run --rm -v $(pwd)/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml prom/prometheus:v2.55.1 promtool check config /etc/prometheus/prometheus.yml
    - echo "✅ Prometheus configuration is valid"
    
    # 4. Проверяем, что образы существуют
    - echo "Checking Docker images availability..."
    - docker pull prom/prometheus:v2.55.1
    - docker pull grafana/grafana:9.5.1
    - docker pull prom/snmp-exporter:v0.22.0
    - echo "✅ All images are available"
    
    # 5. Проверяем, что сервисы могут запуститься
    - echo "Checking if services can start..."
    - docker-compose up -d --no-build
    - docker-compose ps
    - docker-compose down
    - echo "✅ All services can start successfully"
    
    # 6. Проверяем порты (упрощённо)
    - echo "Checking port mappings..."
    - docker-compose config | grep -E "ports:" -A 3 || echo "No port mappings found"
    
    - echo "🎉 All checks passed successfully!"
  only:
    - main
    - develop