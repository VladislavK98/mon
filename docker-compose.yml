version: '3.9'

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    container_name: prometheus
    hostname: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    dns:
      - 10.10.10.15
    restart: unless-stopped

  grafana:
    image: grafana/grafana:9.5.1
    ports:
      - "3000:3000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/dashboards/windows_exporter_dashboard.json:/var/lib/grafana/dashboards/windows_exporter_dashboard.json
      - ./grafana/provisioning/dashboards/cameras_dvr_dashboard.json:/var/lib/grafana/dashboards/cameras_dvr_dashboard.json
      - ./grafana/config/grafana.ini:/etc/grafana/grafana.ini
      - ./grafana/provisioning/playlists:/etc/grafana/provisioning/playlists
    depends_on:
      - prometheus
      - loki
    hostname: grafana
    environment:
      - GF_INSTALL_PLUGINS=ddurieux-glpi-app
      - GF_INSTALL_PLUGINS=grafana-clock-panel
      - GF_PROVISIONING_ENABLED=true
      - GF_PROVISIONING_DASHBOARDS_ENABLED=true
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_DASHBOARDS_JSON_PATH=/etc/grafana/provisioning/dashboards
      - GF_DASHBOARDS_JSON_ENABLED=true
    restart: unless-stopped

  snmp_exporter:
    image: prom/snmp-exporter:v0.22.0
    ports:
      - "9116:9116"
    volumes:
      - ./snmp.yml:/etc/snmp.yml
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.1
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml -server.http-listen-address=0.0.0.0
    volumes:
      - loki-data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    hostname: alloy
    ports:
      - "12345:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    restart: unless-stopped

  blackbox_exporter:
    image: prom/blackbox-exporter:v0.24.0
    ports:
      - "9115:9115"
    volumes:
      - ./blackbox_exporter/blackbox.yml:/etc/blackbox_exporter/config.yml
    restart: unless-stopped

volumes:
  grafana_data:
  loki-data:
  alloy-data:
